# 官方 Broker：部署在 ECS，只监听回环，TLS 由同机 nginx 终止。
# 鉴权交给 mosquitto-go-auth；它回调的 token 服务仍运行在 Mac 上，
# 通过 frp 的 auth-api 隧道映射到 ECS 的 127.0.0.1:18084。

per_listener_settings true

listener 8083 127.0.0.1
protocol websockets
allow_anonymous false

max_packet_size 262144
message_size_limit 262144
max_inflight_messages 20
max_queued_messages 100
max_queued_bytes 1048576

persistence true
persistence_location /var/lib/mosquitto/

auth_plugin /usr/lib/mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host 127.0.0.1
auth_opt_http_port 18084
auth_opt_http_getuser_uri /mqtt/auth
auth_opt_http_aclcheck_uri /mqtt/acl
auth_opt_http_superuser_uri /mqtt/superuser
auth_opt_http_with_tls false
auth_opt_cache true
auth_opt_cache_ttl 300
auth_opt_cache_reset true

log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

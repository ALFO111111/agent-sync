# 官方 Broker：只监听回环，TLS 由 ECS nginx 终止。
# 鉴权交给 mosquitto-go-auth，由它回调本机 token 服务。

per_listener_settings true

listener 8083 127.0.0.1
protocol websockets
allow_anonymous false

max_packet_size 262144
message_size_limit 262144
max_inflight_messages 20
max_queued_messages 100
max_queued_bytes 1048576

persistence true
persistence_location /opt/homebrew/var/mosquitto/

auth_plugin /opt/homebrew/lib/mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host 127.0.0.1
auth_opt_http_port 8787
auth_opt_http_getuser_uri /mqtt/auth
auth_opt_http_aclcheck_uri /mqtt/acl
auth_opt_http_superuser_uri /mqtt/superuser
auth_opt_http_with_tls false
auth_opt_cache true
auth_opt_cache_ttl 30
auth_opt_cache_reset true

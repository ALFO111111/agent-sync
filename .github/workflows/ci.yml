# 每次推送 / PR：格式、静态检查、全部测试、前端文字检查、前端单元测试和构建。Windows 和 macOS 各跑一遍。
# 测试全部在临时目录里跑（云端用本地文件夹或内存假 S3 代替），不需要任何密钥。
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Mobile tests and build
        working-directory: mobile
        run: |
          npm ci
          npm test
          npm run build

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Go 版本以 go.mod 为准：不同版本的 gofmt 对中文的对齐算法不一样，版本不统一时
      # 本机格式化过的代码到 CI 上会被判"没格式化"（v0.2.0 之后 CI 一直失败就是这个原因）。
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 和 Release 共用门禁，确保打标签不能绕过检查。
      - uses: ./.github/actions/validate

      - name: Build self-contained desktop and check bundled host
        shell: bash
        run: go run ./scripts/build-desktop -platform "${{ runner.os == 'Windows' && 'windows/amd64' || 'darwin/arm64' }}" -version dev

# 发布：推送 v 开头的标签（如 v0.3.0、v0.3.0-beta.1）时自动构建并发布到 GitHub Releases。
#
#   1. CHANGELOG.md 里把 [Unreleased] 改成 [0.3.0] - 日期，提交
#   2. git tag -a v0.3.0 -m v0.3.0 && git push github v0.3.0
#
# Windows 和 macOS 分别在各自的系统上编译（Wails 的 Mac 版要用 Xcode 工具链），最后合到一个 Release 里。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 创建 Release、上传文件

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
          - os: macos-latest
            platform: darwin/arm64 # 只支持 Apple 芯片，Intel Mac 不再提供
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version from tag
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/validate

      - name: Build self-contained desktop and check bundled host
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: go run ./scripts/build-desktop -platform '${{ matrix.platform }}' -version "$RELEASE_VERSION"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/bin/agent-sync.exe dist/agent-sync.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          v='${{ steps.ver.outputs.version }}'
          mkdir dist
          scripts/package-dmg.sh build/bin/agent-sync.app "dist/agent-sync-$v-macos-arm64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Mobile tests and build
        working-directory: mobile
        run: |
          npm ci
          npm test
          npm run build
      # 私钥不离开维护者电脑。先把同一提交构建的签名 APK 暂存到 draft，全部验证后才公开。
      - name: Fetch and verify staged signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          mkdir -p dist staged
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "agent-sync-$v-android.apk" --pattern android-build.json --dir staged
          VERSION="$v" python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          version = os.environ['VERSION']
          name = f'agent-sync-{version}-android.apk'
          apk = pathlib.Path('staged') / name
          manifest = json.loads(pathlib.Path('staged/android-build.json').read_text())
          assert manifest['sourceCommit'] == os.environ['GITHUB_SHA'], 'APK source commit does not match tag'
          assert manifest['version'] == version, 'APK version mismatch'
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == manifest['sha256'], 'APK checksum mismatch'
          shutil.copyfile(apk, pathlib.Path('dist') / name)
          PY
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$tools/apksigner" verify --verbose --print-certs "dist/agent-sync-$v-android.apk" | tee staged/signature.txt
          expected="$(tr -d '\r\n ' < mobile/android/release-certificate.sha256)"
          actual="$(sed -n -E 's/^(Signer #1|V2 Signer):? certificate SHA-256 digest: //p' staged/signature.txt | sort -u | tr -d '\r\n ')"
          test "$actual" = "$expected"
          "$tools/aapt" dump badging "dist/agent-sync-$v-android.apk" > staged/badging.txt
          grep -F "package: name='com.alfo.agentsync'" staged/badging.txt
          grep -F "versionName='$v'" staged/badging.txt
          ! grep -q '^application-debuggable' staged/badging.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dist-Android
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        id: ver
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          test -s dist/agent-sync.exe
          test -s "dist/agent-sync-$v-macos-arm64.dmg"
          test -s "dist/agent-sync-$v-android.apk"
          (cd dist && sha256sum * > ../SHA256SUMS.txt) && mv SHA256SUMS.txt dist/
          (cd dist && sha256sum -c SHA256SUMS.txt)
          # 取 CHANGELOG.md 里 "## [版本号]" 到下一个 "## [" 之间的内容
          awk -v ver="$v" '
            index($0, "## [" ver "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "Missing CHANGELOG section for $v" >&2; exit 1; }
          echo "--- release notes ---"; cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          fail_on_unmatched_files: true
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/agent-sync.exe
            dist/agent-sync-${{ steps.ver.outputs.version }}-macos-arm64.dmg
            dist/agent-sync-${{ steps.ver.outputs.version }}-android.apk
            dist/SHA256SUMS.txt
